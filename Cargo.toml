[package]
name = "wxshot"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_10"] }
ashpd = { version = "0.13.13", features = ["screenshot"] }
pangocairo = "0.22.9"
tokio = { version = "1", features = ["rt", "net", "time"] }
cairo-rs = { version = "0.22.9", features = ["png"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
